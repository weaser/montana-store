<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONTANA STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #000;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #000;
            color: #fff;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-cart-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            position: relative;
            padding: 8px;
        }

        .cart-badge {
            position: absolute;
            top: 0;
            right: 0;
            background: #ff4444;
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 100px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            border-top: 2px solid #000;
            display: flex;
            justify-content: space-around;
            max-width: 500px;
            margin: 0 auto;
        }

        .nav-btn {
            flex: 1;
            padding: 16px;
            border: none;
            background: #000;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border-radius: 0;
            transition: background 0.2s;
        }

        .nav-btn.active {
            background: #333;
        }

        .nav-btn:active {
            background: #222;
        }

        .hidden {
            display: none;
        }

        /* Product Cards */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .product-card {
            border: 1px solid #000;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-card:active {
            transform: scale(0.95);
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }

        .product-image {
            width: 100%;
            height: 150px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999;
            flex: 1;
        }

        .product-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-info {
            padding: 12px;
            border-top: 1px solid #000;
            text-align: center;
        }

        .product-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .product-price {
            color: #000;
            font-weight: bold;
            font-size: 16px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 450px;
            border-radius: 8px;
            overflow-y: auto;
            max-height: 90vh;
            border: 2px solid #000;
        }

        .modal-header {
            background: #000;
            color: #fff;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body {
            padding: 16px;
        }

        /* Cart */
        .cart-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            border: 1px solid #000;
            border-radius: 4px;
            margin-bottom: 12px;
            align-items: center;
        }

        .cart-item-image {
            width: 60px;
            height: 60px;
            background: #f0f0f0;
            border: 1px solid #000;
            border-radius: 4px;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: bold;
            font-size: 14px;
        }

        .cart-item-price {
            font-size: 14px;
            color: #666;
        }

        .cart-item-remove {
            background: #f0f0f0;
            border: 1px solid #000;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 8px;
            align-items: center;
        }

        .category-tab {
            padding: 8px 16px;
            border: 2px solid #000;
            background: #000;
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .category-tab.active {
            background: #333;
            color: #fff;
        }

        .add-product-btn {
            background: #000;
            color: #fff;
            border: 2px solid #000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            background: #000;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        .btn:active {
            background: #333;
        }

        .btn-secondary {
            background: #fff;
            color: #000;
        }

        .btn-secondary:active {
            background: #f0f0f0;
        }

        .btn-danger {
            background: #f44336;
            border-color: #f44336;
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #000;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .photo-preview {
            width: 100%;
            height: 150px;
            background: #f0f0f0;
            border: 1px dashed #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 12px;
            color: #999;
            overflow: auto;
        }

        .photo-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .photo-gallery {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 8px 0;
        }

        .photo-thumb {
            position: relative;
            width: 80px;
            height: 80px;
            border: 1px solid #000;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .photo-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .photo-thumb-remove {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #f44336;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
        }

        .product-gallery-main {
            position: relative;
            width: 100%;
            height: 250px;
            background: #f0f0f0;
            border: 1px solid #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .product-gallery-main img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .gallery-nav-buttons {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .gallery-nav-btn {
            background: #000;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: #999;
        }

        .empty-state-text {
            font-size: 14px;
            margin-bottom: 16px;
        }

        /* Profile */
        .profile-section {
            background: #f9f9f9;
            border: 1px solid #000;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .profile-section-title {
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .review-card {
            border: 1px solid #000;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .review-name {
            font-weight: bold;
            font-size: 14px;
        }

        .review-rating {
            color: #ff9800;
            margin: 4px 0;
            font-size: 14px;
        }

        .review-text {
            font-size: 14px;
            color: #333;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <span>MONTANA STORE</span>
            <button class="header-cart-btn" onclick="app.openCart()">
                🛒
                <span class="cart-badge" id="cartCount" style="display: none;">0</span>
            </button>
        </div>
        
        <div class="content" id="content">
            <!-- Главная -->
            <div id="home-page" class="page">
                <div id="homeMessage"></div>
                <div class="product-grid" id="homeProducts"></div>
            </div>

            <!-- Каталог -->
            <div id="catalog-page" class="page hidden">
                <div class="category-tabs" id="categoryTabs"></div>
                <div class="product-grid" id="catalogProducts"></div>
            </div>

            <!-- Профиль -->
            <div id="profile-page" class="page hidden">
                <div id="profileContent"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn active" onclick="app.navigate('home')">Главная</button>
            <button class="nav-btn" onclick="app.navigate('catalog')">Каталог</button>
            <button class="nav-btn" onclick="app.navigate('profile')">Профиль</button>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">Товар</span>
                <button class="modal-close" onclick="app.closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>🛒 Корзина</span>
                <button class="modal-close" onclick="app.closeCart()">✕</button>
            </div>
            <div class="modal-body" id="cartModalBody"></div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div id="addProductModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>➕ Добавить товар</span>
                <button class="modal-close" onclick="app.closeAddProduct()">✕</button>
            </div>
            <div class="modal-body" id="addProductBody"></div>
        </div>
    </div>

    <script>
        const app = {
            currentPage: 'home',
            currentUser: null,
            isAdmin: false,
            cart: [],
            uploadedPhotos: [],
            currentProductImageIndex: 0,
            
            init() {
                this.loadData();
                this.getCurrentUser();
                this.renderPage('home');
                this.attachEventListeners();
                this.updateCartBadge();
            },

            loadData() {
                const stored = localStorage.getItem('montanaStore');
                if (!stored) {
                    this.initializeData();
                } else {
                    window.storeData = JSON.parse(stored);
                }
            },

            initializeData() {
                window.storeData = {
                    admin: { username: 'admin', password: 'montana123' },
                    categories: ['Куртки', 'Кроссовки', 'Толстовки', 'Штаны'],
                    products: [
                        {
                            id: 1,
                            name: 'Stone Island Куртка',
                            category: 'Куртки',
                            price: 8500,
                            description: 'Премиум качество',
                            sizes: ['S', 'M', 'L', 'XL'],
                            images: ['data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23ddd%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2220%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22%3EStone Island%3C/text%3E%3C/svg%3E']
                        }
                    ],
                    reviews: [
                        {
                            id: 1,
                            name: 'Иван',
                            rating: 5,
                            text: 'Отличный магазин!'
                        }
                    ]
                };
                this.saveData();
            },

            saveData() {
                localStorage.setItem('montanaStore', JSON.stringify(window.storeData));
            },

            getCurrentUser() {
                const tgUserId = localStorage.getItem('tgUserId') || 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('tgUserId', tgUserId);
                this.currentUser = { id: tgUserId, name: 'Покупатель' };
                this.cart = JSON.parse(localStorage.getItem('cart_' + tgUserId) || '[]');
            },

            navigate(page) {
                this.currentPage = page;
                document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
                document.getElementById(page + '-page').classList.remove('hidden');
                
                document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
                    btn.classList.remove('active');
                    if ((idx === 0 && page === 'home') || 
                        (idx === 1 && page === 'catalog') || 
                        (idx === 2 && page === 'profile')) {
                        btn.classList.add('active');
                    }
                });

                if (page === 'home') this.renderHome();
                if (page === 'catalog') this.renderCatalog();
                if (page === 'profile') this.renderProfile();
            },

            renderHome() {
                const homeMessage = document.getElementById('homeMessage');
                homeMessage.innerHTML = `<h2 style="font-size: 18px; margin-bottom: 16px;">Добро пожаловать!</h2>`;
                
                const featured = window.storeData.products.slice(0, 4);
                this.renderProductGrid('homeProducts', featured);
            },

            renderCatalog() {
                this.renderCategories();
                this.renderCatalogProducts(window.storeData.categories[0]);
            },

            renderCategories() {
                const container = document.getElementById('categoryTabs');
                let html = window.storeData.categories.map(cat => 
                    `<button class="category-tab ${cat === window.storeData.categories[0] ? 'active' : ''}" 
                    onclick="app.renderCatalogProducts('${cat}')">${cat}</button>`
                ).join('');
                
                if (this.isAdmin) {
                    html += `<button class="add-product-btn" onclick="app.showAddProduct()">+</button>`;
                }
                
                container.innerHTML = html;
            },

            renderCatalogProducts(category) {
                document.querySelectorAll('.category-tab').forEach(tab => {
                    if (tab.classList.contains('category-tab')) {
                        tab.classList.remove('active');
                    }
                });
                if (event?.target?.classList.contains('category-tab')) {
                    event.target.classList.add('active');
                }
                
                const products = window.storeData.products.filter(p => p.category === category);
                this.renderProductGrid('catalogProducts', products);
            },

            renderProductGrid(containerId, products) {
                const container = document.getElementById(containerId);
                if (products.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-state-text">Товаров нет</div></div>';
                    return;
                }
                
                container.innerHTML = products.map(product => {
                    const firstImage = product.images && product.images.length > 0 ? product.images[0] : product.image;
                    return `
                    <div class="product-card" onclick="app.showProductDetail(${product.id})">
                        <div class="product-image">
                            ${firstImage ? `<img src="${firstImage}" alt="${product.name}">` : product.name}
                        </div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-price">${product.price}₽</div>
                        </div>
                    </div>
                `;
                }).join('');
            },

            showProductDetail(productId) {
                const product = window.storeData.products.find(p => p.id === productId);
                if (!product) return;

                const modal = document.getElementById('productModal');
                document.getElementById('modalTitle').textContent = product.name;
                
                const images = product.images && product.images.length > 0 ? product.images : [product.image];
                const firstImage = images[0];
                
                let html = `
                    <div class="product-gallery-main" id="galleryMain">
                        ${firstImage ? `<img src="${firstImage}" alt="${product.name}">` : product.name}
                        ${images.length > 1 ? `
                            <div class="gallery-nav-buttons">
                                <button class="gallery-nav-btn" onclick="app.prevProductImage(${productId})">◀</button>
                                <span style="align-self: center; font-size: 12px; color: #666;">
                                    <span id="imageCounter">1</span> / ${images.length}
                                </span>
                                <button class="gallery-nav-btn" onclick="app.nextProductImage(${productId})">▶</button>
                            </div>
                        ` : ''}
                    </div>
                `;
                
                if (images.length > 1) {
                    html += `
                        <div class="photo-gallery" id="photoThumbs">
                            ${images.map((img, idx) => `
                                <div class="photo-thumb" onclick="app.showProductImage(${productId}, ${idx})">
                                    <img src="${img}" alt="Photo ${idx + 1}">
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
                
                html += `
                    <div><strong>Цена:</strong> ${product.price}₽</div>
                    <div style="margin-top: 8px;"><strong>Описание:</strong></div>
                    <p style="font-size: 14px; color: #666; margin-top: 4px; margin-bottom: 16px;">${product.description}</p>
                `;
                
                if (!this.isAdmin) {
                    html += `
                        <label style="display: block; margin-bottom: 8px; font-weight: bold;">Выберите размер:</label>
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px;">
                    `;
                    
                    product.sizes.forEach(size => {
                        html += `<button class="btn" style="margin: 0; padding: 8px;" onclick="app.addToCart(${product.id}, '${size}'); app.closeModal();">${size}</button>`;
                    });
                    
                    html += `</div>`;
                } else {
                    html += `
                        <button class="btn btn-danger" onclick="app.deleteProduct(${product.id}); app.closeModal();">🗑️ Удалить товар</button>
                    `;
                }
                
                document.getElementById('modalBody').innerHTML = html;
                this.currentProductImages = images;
                this.currentProductImageIndex = 0;
                modal.classList.add('active');
            },

            showProductImage(productId, index) {
                this.currentProductImageIndex = index;
                const product = window.storeData.products.find(p => p.id === productId);
                const images = product.images && product.images.length > 0 ? product.images : [product.image];
                const gallery = document.getElementById('galleryMain');
                if (gallery) {
                    gallery.innerHTML = `<img src="${images[index]}" alt="Product">`;
                    if (images.length > 1) {
                        gallery.innerHTML += `
                            <div class="gallery-nav-buttons">
                                <button class="gallery-nav-btn" onclick="app.prevProductImage(${productId})">◀</button>
                                <span style="align-self: center; font-size: 12px; color: #666;">
                                    ${index + 1} / ${images.length}
                                </span>
                                <button class="gallery-nav-btn" onclick="app.nextProductImage(${productId})">▶</button>
                            </div>
                        `;
                    }
                }
            },

            prevProductImage(productId) {
                const product = window.storeData.products.find(p => p.id === productId);
                const images = product.images && product.images.length > 0 ? product.images : [product.image];
                this.currentProductImageIndex = (this.currentProductImageIndex - 1 + images.length) % images.length;
                this.showProductImage(productId, this.currentProductImageIndex);
            },

            nextProductImage(productId) {
                const product = window.storeData.products.find(p => p.id === productId);
                const images = product.images && product.images.length > 0 ? product.images : [product.image];
                this.currentProductImageIndex = (this.currentProductImageIndex + 1) % images.length;
                this.showProductImage(productId, this.currentProductImageIndex);
            },

            deleteProduct(productId) {
                if (confirm('Удалить этот товар?')) {
                    window.storeData.products = window.storeData.products.filter(p => p.id !== productId);
                    this.saveData();
                    this.renderCatalog();
                }
            },

            addToCart(productId, size) {
                const product = window.storeData.products.find(p => p.id === productId);
                const image = product.images && product.images.length > 0 ? product.images[0] : product.image;
                this.cart.push({
                    productId,
                    name: product.name,
                    price: product.price,
                    size,
                    image,
                    id: Date.now()
                });
                this.saveCart();
                this.updateCartBadge();
            },

            saveCart() {
                localStorage.setItem('cart_' + this.currentUser.id, JSON.stringify(this.cart));
            },

            updateCartBadge() {
                const badge = document.getElementById('cartCount');
                if (this.cart.length > 0) {
                    badge.textContent = this.cart.length;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            },

            openCart() {
                const modal = document.getElementById('cartModal');
                const container = document.getElementById('cartModalBody');
                
                let html = '';
                
                if (this.cart.length === 0) {
                    html = '<div class="empty-state"><div class="empty-state-text">Корзина пуста</div></div>';
                } else {
                    let total = 0;
                    this.cart.forEach(item => {
                        total += item.price;
                        html += `
                            <div class="cart-item">
                                <div class="cart-item-image">
                                    ${item.image ? `<img src="${item.image}" alt="${item.name}">` : '📦'}
                                </div>
                                <div class="cart-item-details">
                                    <div class="cart-item-name">${item.name}</div>
                                    <div class="cart-item-price">Размер: ${item.size} | ${item.price}₽</div>
                                </div>
                                <button class="cart-item-remove" onclick="app.removeFromCart(${item.id}); app.openCart();">✕</button>
                            </div>
                        `;
                    });
                    
                    html += `
                        <div style="background: #f0f0f0; padding: 12px; border-radius: 4px; margin-top: 16px; margin-bottom: 16px;">
                            <strong style="font-size: 16px;">Итого: ${total}₽</strong>
                        </div>
                        <a href="https://t.me/MONTANA_BOGDAN" target="_blank" style="text-decoration: none;">
                            <button class="btn">Заказать в Telegram</button>
                        </a>
                    `;
                }
                
                container.innerHTML = html;
                modal.classList.add('active');
            },

            closeCart() {
                document.getElementById('cartModal').classList.remove('active');
            },

            removeFromCart(itemId) {
                this.cart = this.cart.filter(item => item.id !== itemId);
                this.saveCart();
                this.updateCartBadge();
            },

            closeModal() {
                document.getElementById('productModal').classList.remove('active');
                this.updateCartBadge();
            },

            renderProfile() {
                const container = document.getElementById('profileContent');
                
                let html = `
                    <div class="profile-section">
                        <div class="profile-section-title">Ваши данные</div>
                        <p>Статус: ${this.isAdmin ? '👨‍💼 Администратор' : 'Покупатель'}</p>
                    </div>
                `;
                
                if (!this.isAdmin) {
                    html += `
                        <div class="profile-section">
                            <button class="btn btn-secondary" onclick="app.showAdminLogin()">Админ Панель</button>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="profile-section">
                            <button class="btn" onclick="app.logout()">Выход из админа</button>
                        </div>
                    `;
                }
                
                // Reviews
                html += `
                    <div class="profile-section">
                        <div class="profile-section-title">Отзывы</div>
                `;
                
                window.storeData.reviews.forEach(review => {
                    html += `
                        <div class="review-card">
                            <div class="review-name">${review.name}</div>
                            <div class="review-rating">${'⭐'.repeat(review.rating)}</div>
                            <div class="review-text">"${review.text}"</div>
                            ${this.isAdmin ? `<button class="btn btn-danger" style="margin-top: 8px;" onclick="app.deleteReview(${review.id})">Удалить</button>` : ''}
                        </div>
                    `;
                });
                
                if (this.isAdmin) {
                    html += `
                        <button class="btn" style="margin-top: 12px;" onclick="app.showAddReview()">➕ Добавить отзыв</button>
                    `;
                }
                
                html += `</div>`;
                
                container.innerHTML = html;
            },

            showAdminLogin() {
                const modal = document.getElementById('addProductModal');
                document.getElementById('addProductBody').innerHTML = `
                    <div class="form-group">
                        <label>Логин:</label>
                        <input type="text" id="adminUsername" placeholder="Введите логин">
                    </div>
                    <div class="form-group">
                        <label>Пароль:</label>
                        <input type="password" id="adminPassword" placeholder="Введите пароль">
                    </div>
                    <button class="btn" onclick="app.checkAdminLogin()">Войти</button>
                `;
                modal.classList.add('active');
            },

            checkAdminLogin() {
                const username = document.getElementById('adminUsername').value;
                const password = document.getElementById('adminPassword').value;
                
                if (username === window.storeData.admin.username && password === window.storeData.admin.password) {
                    this.isAdmin = true;
                    this.closeAddProduct();
                    this.navigate('profile');
                } else {
                    alert('Неверные учетные данные');
                }
            },

            showAddProduct() {
                const modal = document.getElementById('addProductModal');
                let html = `
                    <div class="form-group">
                        <label>Название:</label>
                        <input type="text" id="prodName" placeholder="Название товара">
                    </div>
                    <div class="form-group">
                        <label>Категория:</label>
                        <select id="prodCategory">
                `;
                
                window.storeData.categories.forEach(cat => {
                    html += `<option value="${cat}">${cat}</option>`;
                });
                
                html += `
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Цена:</label>
                        <input type="number" id="prodPrice" placeholder="Цена в рублях">
                    </div>
                    <div class="form-group">
                        <label>Описание:</label>
                        <textarea id="prodDesc" placeholder="Описание товара"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Размеры (через запятую):</label>
                        <input type="text" id="prodSizes" placeholder="S, M, L, XL">
                    </div>
                    <div class="form-group">
                        <label>Фотографии товара (можно несколько):</label>
                        <button class="btn btn-secondary" onclick="document.getElementById('prodPhotos').click()">➕ Добавить фото</button>
                        <input type="file" id="prodPhotos" accept="image/*" multiple onchange="app.handleMultiplePhotos()" style="display: none;">
                        <div class="photo-gallery" id="photoGallery"></div>
                    </div>
                    <button class="btn" onclick="app.addNewProduct()">➕ Добавить товар</button>
                    <button class="btn btn-secondary" onclick="app.closeAddProduct()">Отмена</button>
                `;
                
                document.getElementById('addProductBody').innerHTML = html;
                modal.classList.add('active');
            },

            handleMultiplePhotos() {
                const files = document.getElementById('prodPhotos').files;
                this.uploadedPhotos = [];
                const gallery = document.getElementById('photoGallery');
                gallery.innerHTML = '';
                
                Array.from(files).forEach((file, idx) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.uploadedPhotos.push(e.target.result);
                        const thumb = document.createElement('div');
                        thumb.className = 'photo-thumb';
                        thumb.innerHTML = `
                            <img src="${e.target.result}" alt="Photo">
                            <button class="photo-thumb-remove" onclick="app.removeUploadedPhoto(${idx})">✕</button>
                        `;
                        gallery.appendChild(thumb);
                    };
                    reader.readAsDataURL(file);
                });
            },

            removeUploadedPhoto(index) {
                this.uploadedPhotos.splice(index, 1);
                document.getElementById('prodPhotos').value = '';
                const gallery = document.getElementById('photoGallery');
                gallery.innerHTML = '';
                this.uploadedPhotos.forEach((photo, idx) => {
                    const thumb = document.createElement('div');
                    thumb.className = 'photo-thumb';
                    thumb.innerHTML = `
                        <img src="${photo}" alt="Photo">
                        <button class="photo-thumb-remove" onclick="app.removeUploadedPhoto(${idx})">✕</button>
                    `;
                    gallery.appendChild(thumb);
                });
            },

            addNewProduct() {
                const name = document.getElementById('prodName').value;
                const category = document.getElementById('prodCategory').value;
                const price = parseInt(document.getElementById('prodPrice').value);
                const description = document.getElementById('prodDesc').value;
                const sizes = document.getElementById('prodSizes').value.split(',').map(s => s.trim());
                const images = this.uploadedPhotos && this.uploadedPhotos.length > 0 ? 
                    this.uploadedPhotos : 
                    ['data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23ddd%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2220%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22%3E' + name + '%3C/text%3E%3C/svg%3E'];
                
                if (!name || !price || !description || sizes.length === 0) {
                    alert('Заполни все поля!');
                    return;
                }
                
                const newProduct = {
                    id: Date.now(),
                    name,
                    category,
                    price,
                    description,
                    sizes,
                    images
                };
                
                window.storeData.products.push(newProduct);
                this.saveData();
                this.uploadedPhotos = [];
                this.closeAddProduct();
                this.renderCatalog();
                alert('Товар добавлен!');
            },

            showAddReview() {
                const modal = document.getElementById('addProductModal');
                document.getElementById('addProductBody').innerHTML = `
                    <div class="form-group">
                        <label>Имя:</label>
                        <input type="text" id="reviewName" placeholder="Имя">
                    </div>
                    <div class="form-group">
                        <label>Рейтинг:</label>
                        <select id="reviewRating">
                            <option value="5">⭐⭐⭐⭐⭐ 5 звезд</option>
                            <option value="4">⭐⭐⭐⭐ 4 звезды</option>
                            <option value="3">⭐⭐⭐ 3 звезды</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Отзыв:</label>
                        <textarea id="reviewText" placeholder="Текст отзыва"></textarea>
                    </div>
                    <button class="btn" onclick="app.addNewReview()">➕ Добавить отзыв</button>
                    <button class="btn btn-secondary" onclick="app.closeAddProduct()">Отмена</button>
                `;
                modal.classList.add('active');
            },

            addNewReview() {
                const name = document.getElementById('reviewName').value;
                const rating = parseInt(document.getElementById('reviewRating').value);
                const text = document.getElementById('reviewText').value;
                
                if (!name || !text) {
                    alert('Заполни все поля!');
                    return;
                }
                
                const newReview = {
                    id: Date.now(),
                    name,
                    rating,
                    text
                };
                
                window.storeData.reviews.push(newReview);
                this.saveData();
                this.closeAddProduct();
                this.renderProfile();
                alert('Отзыв добавлен!');
            },

            deleteReview(reviewId) {
                if (confirm('Удалить отзыв?')) {
                    window.storeData.reviews = window.storeData.reviews.filter(r => r.id !== reviewId);
                    this.saveData();
                    this.renderProfile();
                }
            },

            closeAddProduct() {
                document.getElementById('addProductModal').classList.remove('active');
                this.uploadedPhotos = [];
            },

            logout() {
                this.isAdmin = false;
                this.renderProfile();
            },

            attachEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeModal();
                        this.closeCart();
                        this.closeAddProduct();
                    }
                });
            }
        };

        app.init();
    </script>
</body>
</html>
